[project]
name = "orquestador"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "a2a-sdk>=1.3.0",
    "psycopg[binary]>=3.3.8",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
